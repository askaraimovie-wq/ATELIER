name: Build ATELIER Windows VST3

"on":
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Place Workflow Into .github/workflows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".github/workflows" | Out-Null
          if (Test-Path "build-windows.yml") {
            Copy-Item -Path "build-windows.yml" -Destination ".github/workflows/build-windows.yml" -Force
          }

      - name: Setup MSBuild / Visual Studio Environment
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build VST3 and Standalone (Release)
        run: cmake --build build --config Release --target ATELIER_VST3 ATELIER_Standalone

      - name: Rename VST3 with Version Tag
        shell: pwsh
        run: |
          $version = "v1.0.0"
          $vst3Dir = Get-ChildItem -Path "build/ATELIER_artefacts/Release/VST3" -Filter "*.vst3" -Directory | Select-Object -First 1
          if ($null -ne $vst3Dir) {
            New-Item -ItemType Directory -Force -Path "release_output" | Out-Null
            Copy-Item -Path $vst3Dir.FullName -Destination "release_output/ATELIER $version.vst3" -Recurse -Force
          }

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATELIER-v1.0.0-Windows-VST3
          path: release_output/
